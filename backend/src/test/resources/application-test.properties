# Used by tests annotated with @ActiveProfiles("test").
# In-memory H2 instead of PostgreSQL, so tests (and `mvn package`) run without a database server.
# Everything else, e.g. jwt.secret, still comes from src/main/resources/application.properties
spring.datasource.url=jdbc:h2:mem:figmaclone;DB_CLOSE_DELAY=-1
spring.datasource.username=admin
spring.datasource.password=admin
spring.jpa.hibernate.ddl-auto=create-drop
