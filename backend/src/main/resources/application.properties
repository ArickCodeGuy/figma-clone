spring.application.name=backend
server.port=5137

# Values below come from `.env` (KEY=VALUE, same format as .properties)
# or from real environment variables, which win. See `.env.example`.
# Path is relative to the working directory, so run the app from `./backend`
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${POSTGRES_URL}
spring.datasource.username=${POSTGRES_USERNAME}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.jpa.hibernate.ddl-auto=create

springdoc.swagger-ui.path=/swagger-ui.html

# JWT
jwt.secret=${JWT_SECRET}
# Token life span in ms (default 10 hours)
jwt.life-span=${JWT_LIFE_SPAN:36000000}
